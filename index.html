<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./images/github-logo.png" type="image/x-icon">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Tailwind & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: 'Geist', sans-serif;
        }
    </style>

</head>

<body>
    <div class="navbar max-w-full mx-auto bg-base-100 shadow-sm ">

        <div class="w-11/12 mx-20  flex items-center justify-between">
            <div class="flex-1 flex items-center justify-self-start gap-2">
                <img src="./images/github-logo.png" alt="logo" class="w-10" />
                <h1 class="text-xl font-bold ml-2">GitHub Issues Tracker</h1>
            </div>
            <div class="flex items-center gap-2">
                <div class="input-group">
                    <label class="input">
                        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input id="searchInput" type="search" required placeholder="Search Issues" />
                    </label>
                </div>
               
                <button type="button" class="btn btn-primary ml-2">
                    <span> <i class="fa-solid fa-plus"></i></span>
                    New Issue
                </button>
            </div>
        </div>
    </div>
    
    <!-- issues section -->
    <div class="w-11/12 mx-20 mt-6">
        <!-- tabs -->
        <div class="tabs max-w-full mx-auto bg-base-100 shadow-sm mt-6 my-10 gap-4">
            <button class="tab tab-bordered tab-active w-30 btn btn-soft btn-primary font-bold text-xl" data-status="all">All</button>
            <button class="tab tab-bordered w-30 btn btn-soft btn-primary font-bold text-xl" data-status="open">Open</button>
            <button class="tab tab-bordered w-30 btn btn-soft btn-primary font-bold text-xl" data-status="closed">Closed</button>
        </div>

        <!-- summary / count row -->
        <div id="issue-summary" class="flex justify-between items-center py-4">
            <div class="flex items-center gap-2">
                
                <img src="./images/Aperture.png" alt="Aperture" class="w-4" />
                <span id="issues-count" class="font-semibold">0</span>
                <span>issues</span>
                <br>
                <p>Track and manage your project issues</p>
            </div>
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1"><img src="./images/Open-Status.png" class="w-4" alt="open"/> Open</span>
                <span class="flex items-center gap-1"><img src="./images/Closed- Status .png" class="w-4" alt="closed"/> Closed</span>
            </div>
        </div>

        <!-- loader -->
        <div id="loader" class="flex justify-center items-center py-10 hidden">
            <span class="loading loading-spinner loading-lg"></span>
        </div>

        <!-- issues grid -->
        <div id="issues-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <!-- modal -->
    <div id="issue-modal" class="modal">
        <div class="modal-box relative">
            <button class="btn btn-sm btn-circle absolute right-2 top-2" id="modal-close">✕</button>
            <h3 id="modal-title" class="text-lg font-bold"></h3>
            <p id="modal-description" class="py-4"></p>
            <div id="modal-details" class="space-y-2 text-sm"></div>
        </div>
    </div>

    <script src="./script/main.js"></script>
</body>

</html>
